name: Collect release metrics

on:
  schedule:
    # 09:17 JST. Scheduled workflows use UTC and may start a little late.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-release-metrics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Collect repository and release metrics
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: bash scripts/collect-metrics.sh

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics/history.csv
          if git diff --cached --quiet; then
            echo "No metrics changed"
          else
            git commit -m "metrics: update release traffic"
            git push
          fi
